<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="txGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#txGradient)" />
  
  <!-- Inner Glow Effect -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Ticket Outline Emblem -->
  <g transform="translate(106, 126)" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ticket Body -->
    <path d="M 30 0 L 270 0 C 270 35 300 35 300 0 L 300 260 C 270 260 270 295 300 295 L 0 295 C 30 295 30 260 0 260 L 0 0 Z" fill="rgba(255, 255, 255, 0.12)" />
    
    <!-- Styled X inside ticket -->
    <path d="M 85 75 L 215 220" stroke="#FFFFFF" stroke-width="32" />
    <path d="M 215 75 L 85 220" stroke="#FFFFFF" stroke-width="32" />
    
    <!-- Top & Bottom Dots -->
    <circle cx="150" cy="40" r="10" fill="#FFFFFF" stroke="none" />
    <circle cx="150" cy="255" r="10" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
